<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4fc3f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เมืองออมเงิน">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>เมืองออมเงิน</title>
<style>
:root{
  --ink:#2b2b5a; --sky:#6fd3ff; --grass:#7ddc5a; --sun:#ffd23f; --pink:#ff6fa5; --purple:#7b5cff;
  --orange:#ff9f43; --red:#ff5a5f; --green:#2fc66b; --bg:#e6f7ff; --card:#fff; --mute:#6b6b93;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Mali","Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;line-height:1.35;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h2{font-size:1.3rem;margin:1rem 0 .4rem}
.hint{color:var(--mute);font-size:.85rem}

/* header */
header{position:sticky;top:0;z-index:6;background:linear-gradient(#5ec8ff,#4fc3f7);border-bottom:4px solid var(--ink);
  padding:calc(8px + env(safe-area-inset-top)) 0 10px}
.hd{display:flex;align-items:center;gap:8px}
.hd .nm{flex:1;min-width:0;font-weight:800;font-size:1.1rem;color:#fff;text-shadow:0 2px 0 var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:2px 10px;font-weight:800;font-size:.9rem;white-space:nowrap}
.chip.lv{background:var(--sun)}
.gear{background:#fff;border:3px solid var(--ink);border-radius:14px;width:42px;height:38px;font-size:1.2rem;box-shadow:0 3px 0 var(--ink)}
.xpbar{margin-top:8px;height:18px;background:#fff;border:3px solid var(--ink);border-radius:12px;overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--orange));transition:width .5s}
.xpbar b{position:absolute;inset:0;text-align:center;font-size:.7rem;line-height:12px;font-weight:800}

/* cards & buttons */
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;margin:12px 0;box-shadow:0 4px 0 var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.stat small{display:block;color:var(--mute);font-weight:700;font-size:.8rem}
.stat b{font-size:1.35rem}
.stat.sv{background:#fff4c2}.stat.in{background:#d8f8e3}.stat.out{background:#ffe0e3}.stat.bal{background:#e2dcff}
.pos{color:#12924a}.neg{color:#d93a40}
.btn{border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:12px 16px;font-weight:800;font-size:1.05rem;background:#fff;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.warn{background:var(--red);color:#fff}
.btn.sun{background:var(--sun)}
.btn.sm{width:auto;padding:8px 14px;font-size:.95rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:20px;background:#eee;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .5s}
.bar.over i{background:var(--red)}
.bar.warnb i{background:var(--orange)}

/* city scene */
.scene{position:relative;margin-top:12px;border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#bdeaff}
.sky{position:relative;height:118px;background:linear-gradient(#58c4ff,#c6f0ff)}
.sun{position:absolute;right:16px;top:8px;font-size:2.4rem;animation:spin 12s linear infinite}
.cloud{position:absolute;font-size:2.2rem;opacity:.95;animation:drift 18s linear infinite}
.cloud.c1{top:10px;left:-10%}
.cloud.c2{top:48px;left:-40%;animation-duration:26s;font-size:1.7rem}
.skyline{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:2.3rem;letter-spacing:2px;white-space:nowrap;overflow:hidden}
.ground{background:linear-gradient(#86e063,#5bc23f);padding:12px 10px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:4px solid var(--ink)}
.tile{aspect-ratio:1/1;background:rgba(255,255,255,.35);border:2px dashed rgba(43,43,90,.35);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.1rem;line-height:1}
.tile small{font-size:.58rem;font-weight:800;margin-top:3px;text-align:center;color:var(--ink);line-height:1.1}
.tile.on{background:rgba(255,255,255,.7);border:2px solid var(--ink);animation:pop .5s backwards}
.tile.on span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.tile.lock{opacity:.55;font-size:1.3rem}
.tile.lock small{font-size:.6rem}
.banner{position:absolute;left:10px;top:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px;font-weight:800;font-size:.9rem;box-shadow:0 3px 0 var(--ink);z-index:2}
.scene.ruined{filter:saturate(.35) brightness(.88)}
.scene.ruined .sky{background:linear-gradient(#7d8794,#b6bec6)}
.scene.ruined .sun{animation:none;opacity:.35}
.scene.ruined .tile.on span{animation:shake 1.2s ease-in-out infinite}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rain i{position:absolute;top:-20px;font-style:normal;font-size:.9rem;animation:fall 1.1s linear infinite}
.mood{border:3px solid var(--ink);border-radius:18px;padding:10px 12px;margin:12px 0;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.mood.ok{background:#dcffe8}.mood.bad{background:#ffe3e0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(160vw)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes shake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fall{to{transform:translateY(150px)}}

/* lists */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px}
.seg button{padding:10px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-weight:800}
.seg button.on{background:var(--purple);color:#fff}
.nav2{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin:8px 0}
.nav2 button{height:46px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-size:1.2rem;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.nav2 div{text-align:center;font-weight:800}
.it{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;margin:8px 0}
.it .ic{font-size:1.7rem;width:42px;text-align:center}
.it .t{flex:1;min-width:0}
.it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t small{color:var(--mute)}
.it .a{font-weight:800;white-space:nowrap}
.it .x{background:#eee;border:2px solid var(--ink);border-radius:10px;width:36px;height:36px}
.tag{background:var(--pink);color:#fff;border-radius:8px;padding:0 6px;font-size:.65rem;margin-left:4px}
.empty{text-align:center;color:var(--mute);padding:20px 0}

/* quests / badges */
.q{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;margin:10px 0;box-shadow:0 4px 0 var(--ink)}
.q .ic{font-size:1.9rem}
.q .t{flex:1;min-width:0}
.q .t b{display:block}
.q .t small{color:var(--mute)}
.q.done{background:#fff7d1}.q.got{opacity:.6;background:#e8e8e8}
.xp{background:var(--purple);color:#fff;border-radius:10px;padding:1px 8px;font-size:.75rem;font-weight:800;margin-left:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.bd .ic{font-size:2.2rem}
.bd b{display:block;font-size:.78rem;line-height:1.15}
.bd small{display:block;font-size:.62rem;color:var(--mute);line-height:1.1}
.bd.lock{filter:grayscale(1);opacity:.5}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:4px solid var(--ink);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);height:calc(70px + env(safe-area-inset-bottom))}
nav button{background:none;font-weight:800;font-size:.72rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
nav button i{font-style:normal;font-size:1.5rem;line-height:1}
nav button.on{color:var(--purple);background:#efeaff}
nav .fab{position:relative;background:none}
nav .fab span{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:var(--pink);color:#fff;
  border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:2.2rem;display:flex;align-items:center;justify-content:center;font-weight:800;animation:bob 2s ease-in-out infinite}
nav .fab:active span{transform:translateX(-50%) translateY(3px)}

/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(43,43,90,.55);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom));animation:up .25s}
.sh.mid{align-self:center;border-radius:26px;border-bottom:4px solid var(--ink);margin:14px;width:calc(100% - 28px)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button{padding:10px 2px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:.95rem}
.types button.on.income{background:var(--green);color:#fff}
.types button.on.expense{background:var(--red);color:#fff}
.types button.on.save{background:var(--sun)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.cats button{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 2px;font-size:.7rem;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.cats button i{font-style:normal;font-size:1.7rem}
.cats button.on{background:var(--sun);transform:scale(1.05);box-shadow:0 3px 0 var(--ink)}
.inp{width:100%;padding:10px 12px;font-size:1.1rem;border:3px solid var(--ink);border-radius:14px;background:#fff}
.amt{font-size:2rem;font-weight:800;text-align:center}
label{display:block;font-weight:800;margin:10px 0 4px;font-size:.9rem}
.qa{display:flex;gap:8px;margin:8px 0}
.qa button{flex:1;padding:8px 0;border-radius:12px;border:3px solid var(--ink);background:#fff;font-weight:800}
.big{font-size:3.4rem;text-align:center}
.center{text-align:center}
.cf{position:fixed;top:-30px;font-size:1.8rem;z-index:40;pointer-events:none;animation:cf 2.4s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:24px;font-weight:800;z-index:50;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.file{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hd"><div class="nm" id="hName"></div><div class="chip" id="hStreak"></div><div class="chip lv" id="hLv"></div><button class="gear" data-act="settings" aria-label="ตั้งค่า">⚙️</button></div>
  <div class="xpbar"><i id="xpFill"></i><b id="xpTxt"></b></div>
</div></header>
<main class="wrap" id="app"></main>
<nav>
  <button data-act="tab" data-v="city"><i>🏙️</i>เมือง</button>
  <button data-act="tab" data-v="book"><i>📒</i>สมุด</button>
  <button class="fab" data-act="add" aria-label="เพิ่มรายการ"><span>＋</span></button>
  <button data-act="tab" data-v="quest"><i>🎯</i>ภารกิจ</button>
  <button data-act="tab" data-v="badge"><i>🏅</i>เหรียญ</button>
</nav>
<div id="ov" hidden></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ================= ข้อมูล ================= */
var KEY='citysave_v1';
var DEF={tx:[],budget:15000,name:'เมืองของฉัน',xp:0,claimed:{},badges:{},xpDay:{},best:0,claimedCount:0,lv:1,stage:1};
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tx)){for(var k in DEF)if(!(k in d))d[k]=JSON.parse(JSON.stringify(DEF[k]));return d;}}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
var db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('เก็บข้อมูลไม่ได้ ลองสำรองไฟล์');}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

var CATS={
  income:[['salary','💼','เงินเดือน'],['bonus','🎁','โบนัส/ของขวัญ'],['sell','🛍️','ขายของ'],['interest','📈','ดอกเบี้ย'],['otherin','🪙','อื่นๆ']],
  expense:[['food','🍜','อาหาร'],['trip','🚌','เดินทาง'],['home','🏠','ที่พัก/บิล'],['stuff','🛒','ของใช้'],['health','💊','สุขภาพ'],['study','📚','เรียน'],
           ['sweet','🍰','ขนมหวาน',1],['shop','👗','ช้อปปิ้ง',1],['fun','🎮','บันเทิง',1],['otherout','🧾','อื่นๆ']],
  save:[['saving','🐷','ออมเงิน'],['emergency','🛟','เงินฉุกเฉิน'],['invest','🌱','ลงทุน'],['withdraw','💸','ถอนเงินออม']]
};
var TYPE_TH={income:'รายรับ',expense:'รายจ่าย',save:'เงินออม'};
function catOf(type,id){var l=CATS[type]||[];for(var i=0;i<l.length;i++)if(l[i][0]===id)return l[i];return ['?','❓','อื่นๆ'];}

var STAGES=[
  {n:1,min:0,    e:'🛖',name:'หมู่บ้านไม้',   sky:'🌲🛖🌲🐓🌲'},
  {n:2,min:1000, e:'🏡',name:'หมู่บ้านเจริญ',  sky:'🌳🏡🏡🌳🐄'},
  {n:3,min:5000, e:'🏘️',name:'เมืองขนาดเล็ก', sky:'🏘️🏫⛲🏘️🌳'},
  {n:4,min:20000,e:'🏙️',name:'มหานคร',       sky:'🏢🏙️🏬🏙️🚉'},
  {n:5,min:50000,e:'🏛️',name:'นครหลวง',      sky:'🏛️🗼🏙️🏰🚀'}
];
var BUILD=[
  [1,'🛖','กระท่อมไม้'],[2,'🏡','บ้านสวน'],[3,'🌳','สวนสาธารณะ','🥀'],[4,'🏪','ร้านค้า'],
  [5,'🏫','โรงเรียน'],[6,'⛲','น้ำพุ','🕳️'],[7,'🏥','โรงพยาบาล'],[8,'🏦','ธนาคาร'],
  [10,'🏢','ตึกออฟฟิศ'],[12,'🏬','ห้างสรรพสินค้า'],[14,'🏟️','สนามกีฬา'],[16,'🚉','สถานีรถไฟ'],
  [18,'🎡','ชิงช้าสวรรค์'],[20,'🗼','หอคอย'],[23,'🏰','ปราสาท'],[26,'🚀','ท่าอวกาศ']
];

/* ================= ตัวช่วย ================= */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function addMonths(s,n){var d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d);}
function daysIn(s){var d=parse(s);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
function thDate(s){return parse(s).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'2-digit'});}
function thMonth(s){return parse(s).toLocaleDateString('th-TH',{month:'long',year:'numeric'});}
function fmt(n){return Number(Math.round(n*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});}
function num(v){return parseFloat(String(v==null?'':v).replace(/,/g,''))||0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function $(id){return document.getElementById(id);}
var today=ymd(new Date());
var tt;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2300);}

/* ================= คำนวณการเงิน ================= */
function sv(e){return e.cat==='withdraw'?-e.amt:e.amt;}               // เงินออมแบบมีเครื่องหมาย
function sums(list){
  var r={inc:0,out:0,sav:0,lux:0};
  list.forEach(function(e){
    if(e.type==='income')r.inc+=e.amt;
    else if(e.type==='expense'){r.out+=e.amt;if(catOf('expense',e.cat)[3])r.lux+=e.amt;}
    else r.sav+=sv(e);
  });
  r.bal=r.inc-r.out-r.sav;
  return r;
}
function on(prefix){return db.tx.filter(function(e){return e.date.indexOf(prefix)===0;});}
function savings(){return db.tx.filter(function(e){return e.type==='save';}).reduce(function(s,e){return s+sv(e);},0);}
function stageOf(s){var r=STAGES[0];STAGES.forEach(function(x){if(s>=x.min)r=x;});return r;}
function lvThreshold(l){return 25*l*(l-1);}
function levelOf(xp){var l=1;while(xp>=lvThreshold(l+1))l++;return l;}
function streak(){
  var days={};db.tx.forEach(function(e){days[e.date]=1;});
  var d=days[today]?today:addDays(today,-1),n=0;
  while(days[d]){n++;d=addDays(d,-1);}
  return n;
}
function distress(){
  var ym=today.slice(0,7),m=sums(on(ym)),why=[];
  if(savings()<0)why.push('เงินออมติดลบ');
  if(db.budget>0&&m.out>db.budget)why.push('ใช้จ่ายเดือนนี้เกินงบ');
  if(m.bal<0)why.push('เดือนนี้จ่าย+ออม มากกว่ารายรับ');
  return why;
}

/* ================= เควสต์ ================= */
function weekStart(){var d=parse(today);return addDays(today,-((d.getDay()+6)%7));}
function questList(){
  var td=db.tx.filter(function(e){return e.date===today;}),t=sums(td);
  var ws=weekStart(),we=addDays(ws,6);
  var wk=db.tx.filter(function(e){return e.date>=ws&&e.date<=we;}),w=sums(wk);
  var wd={};wk.forEach(function(e){wd[e.date]=1;});var wDays=Object.keys(wd).length;
  var dayB=db.budget>0?db.budget/daysIn(today):0,st=streak();
  function q(scope,id,ic,title,desc,xp,done,prog){return{key:id+'@'+(scope==='d'?today:ws),scope:scope,ic:ic,title:title,desc:desc,xp:xp,done:done,prog:prog};}
  return [
    q('d','d1','📝','จดบันทึกวันนี้','จดอย่างน้อย 1 รายการ',10,td.length>=1,Math.min(td.length,1)+'/1'),

function checkBadges(){

function afterChange(){

  r.onload=function(){try{
    var d=JSON.parse(r.result);if(!d||!Array.isArray(d.tx))throw 0;
    if(!confirm('นำข้อมูลจากไฟล์มาแทนที่ข้อมูลในเครื่อง ใช่ไหม?'))return;
    for(var k in DEF)if(!(k in d))d[k]=JSON.parse(JSON.stringify(DEF[k]));
    db=d;closeOv();save();toast('นำข้อมูลเข้าแล้ว ✔');render();
  }catch(e){toast('ไฟล์นี้ใช้ไม่ได้');}};
  r.readAsText(f);
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el){ if(ev.target.id==='ov'&&ui.pending.length===0&&!ui.form)closeOv(); return; }
  var f=A[el.dataset.act];if(!f)return;ev.preventDefault();f(el.dataset.v);
});
document.addEventListener('input',function(ev){
  var t=ev.target,f=ui.form;if(!f)return;
  if(t.id==='fAmt')f.amt=t.value;else if(t.id==='fNote')f.note=t.value;else if(t.id==='fDate')f.date=t.value;
});

/* ================= เริ่มต้น ================= */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
(function(){ // เช็กสถานะตอนเปิดแอป (เช่น เปลี่ยนวัน / ได้เหรียญจากข้อมูลเดิม)
  db.lv=Math.max(db.lv,1);
  render();
  var got=checkBadges();got.forEach(function(b){ui.pending.push({k:'badge',b:b});});
  var nl=levelOf(db.xp);if(nl>db.lv){ui.pending.push({k:'level',from:db.lv,to:nl});db.lv=nl;}
  db.stage=stageOf(savings()).n;save();showPending();
})();
})();
</script>
